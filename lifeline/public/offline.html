<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d32f2f">
    <title>Offline | LifeLine</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/lifeline.css">
</head>
<body>
    <!-- Shown by the service worker (sw.js) when a page cannot load without internet. -->
    <main class="container ll-narrow py-5 text-center">
        <p class="h4 fw-bold text-brand mb-4"><i class="bi bi-droplet-fill" aria-hidden="true"></i> LifeLine</p>
        <i class="bi bi-wifi-off display-3 text-secondary" aria-hidden="true"></i>
        <h1 class="h4 fw-bold mt-3">You are offline</h1>
        <p class="text-secondary">LifeLine needs an internet connection to send requests and find donors.
            Check your mobile data or Wi-Fi and try again.</p>
        <p class="text-secondary">In an emergency, call the hospital or blood bank directly.</p>
        <div class="d-grid mt-4">
            <button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>
        </div>
    </main>
</body>
</html>
